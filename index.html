<!DOCTYPE html>
<html lang="pt-BR" class="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#111811" />
  <meta name="description" content="Aplicativo de treino PPL - Push Pull Legs para academia" />
  <title>PPL Workout Tracker</title>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#13ec13",
            "primary-light": "#4dff4d",
            "primary-dark": "#0db80d",
            "accent-red": "#ff4444",
            "accent-blue": "#00a8ff",
            "accent-yellow": "#ffd700",
            "accent-orange": "#ff8c00",
            "background-light": "#f6f8f6",
            "background-dark": "#0a0a0a",
            "surface-dark": "#1a1a1a",
            "surface-elevated": "#242424",
            "text-secondary": "#a0a0a0",
            "text-tertiary": "#666666",
          },
          fontFamily: {
            sans: ["Inter", "-apple-system", "BlinkMacSystemFont", "Segoe UI", "sans-serif"],
          },
          fontSize: {
            'xs': '0.75rem',
            'sm': '0.875rem',
            'base': '1rem',
            'lg': '1.125rem',
            'xl': '1.25rem',
            '2xl': '1.5rem',
            '3xl': '1.875rem',
            '4xl': '2.25rem',
            '5xl': '3rem',
            '6xl': '3.75rem',
            '7xl': '4.5rem',
          },
          borderRadius: {
            'none': '0',
            'sm': '0.125rem',
            'DEFAULT': '0.25rem',
            'md': '0.25rem',
            'lg': '0.5rem',
            'xl': '0.5rem',
            '2xl': '0.5rem',
            'full': '9999px',
          },
          boxShadow: {
            'glow-primary': '0 0 10px rgba(19, 236, 19, 0.5), 0 0 20px rgba(19, 236, 19, 0.5), 0 0 30px rgba(19, 236, 19, 0.5)',
            'glow-primary-sm': '0 0 5px rgba(19, 236, 19, 0.5), 0 0 10px rgba(19, 236, 19, 0.5)',
            'glow-red': '0 0 10px rgba(255, 68, 68, 0.5)',
            'glow-blue': '0 0 10px rgba(0, 168, 255, 0.5)',
          },
          animation: {
            'slide-up': 'slideUp 0.25s cubic-bezier(0.34, 1.56, 0.64, 1)',
            'fade-in': 'fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1)',
            'scale-in': 'scaleIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1)',
            'glow-pulse': 'glowPulse 2s cubic-bezier(0.16, 1, 0.3, 1) infinite',
            'bounce': 'bounce 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55)',
          },
          keyframes: {
            slideUp: {
              '0%': { transform: 'translateY(100%) translateZ(0)', opacity: '0' },
              '100%': { transform: 'translateY(0) translateZ(0)', opacity: '1' },
            },
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            scaleIn: {
              '0%': { transform: 'scale(0.9) translateZ(0)', opacity: '0' },
              '100%': { transform: 'scale(1) translateZ(0)', opacity: '1' },
            },
            glowPulse: {
              '0%, 100%': { boxShadow: '0 0 5px rgba(19, 236, 19, 0.5), 0 0 10px rgba(19, 236, 19, 0.5)' },
              '50%': { boxShadow: '0 0 10px rgba(19, 236, 19, 0.5), 0 0 20px rgba(19, 236, 19, 0.5), 0 0 30px rgba(19, 236, 19, 0.5)' },
            },
            bounce: {
              '0%, 100%': { transform: 'translateY(0) translateZ(0)' },
              '50%': { transform: 'translateY(-10px) translateZ(0)' },
            },
          },
          transitionTimingFunction: {
            'spring': 'cubic-bezier(0.34, 1.56, 0.64, 1)',
            'spring-subtle': 'cubic-bezier(0.25, 0.46, 0.45, 0.94)',
          },
        },
      },
    };
  </script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      overscroll-behavior-y: contain;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="number"] {
      -moz-appearance: textfield;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Safe area for mobile */
    .h-safe-area-inset-bottom {
      height: env(safe-area-inset-bottom, 0);
    }
  </style>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-background-dark text-white antialiased">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
